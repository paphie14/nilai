<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nilai Ekskul Progu</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #333;
        }

        .container {
            width: 90%;
            max-width: 500px;
            padding: 45px 30px;
            text-align: center;
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin: 0 0 15px;
            font-size: 32px;
        }

        p {
            margin: 0;
            font-size: 18px;
            color: #666;
        }

        .status {
            margin-top: 25px;
            padding: 15px;
            border-radius: 10px;
            background: #f1f1f1;
            font-size: 20px;
            font-weight: bold;
        }

        footer {
            margin-top: 25px;
            font-size: 13px;
            color: #999;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Nilai Ekskul & Progu</h1>

        <p>Informasi nilai peserta didik</p>

        <div class="status">
            Belum Ada Nilai
        </div>

        <footer>
            Data nilai belum tersedia.
        </footer>
    </div>

</body>
</html>
